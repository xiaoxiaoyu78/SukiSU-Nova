name: _nova_manager_ci

# 在 fork 里用 GitHub 托管 runner 复现 SukiSU Nova 管理器的源码构建
# 使用固定 keystore（manager_ci/nova-release.keystore.b64）签名，
# 使内核 KSU_EXPECTED_HASH 可以稳定指向该证书。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_nova_manager_ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      KEYSTORE_PASS: NovaPersonal2026
      EXPECTED_CERT_SHA256: 569252d484257f6893731da4049c06515df67fd1cac490e33f541bce716e2d88
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK inventory
        run: |
          set -x
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          ls "$SDK" || true
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true
          ls "$SDK/ndk" || true
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          NDK_DIR="$(ls -d "$SDK"/ndk/* 2>/dev/null | head -n1 || true)"
          if [ -n "$NDK_DIR" ]; then echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"; fi

      - name: Try install SDK components
        continue-on-error: true
        run: |
          set -x
          SDK="$ANDROID_SDK_ROOT"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -n 1)"; fi
          echo "sdkmanager=$SM"
          "$SM" --version || true
          "$SM" "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865" || true
          ls "$SDK/platforms" || true
          ls "$SDK/ndk" || true

      - name: Rust target
        run: |
          set -eux
          rustup target add aarch64-linux-android
          rustc --version

      - name: Build ksud (arm64)
        run: |
          set -o pipefail
          mkdir -p userspace/ksud/bin/aarch64 userspace/ksud/bin/arm userspace/ksud/bin/x86_64 userspace/ksud/bin/riscv64
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
          cargo build --target aarch64-linux-android --release --manifest-path ./userspace/ksud/Cargo.toml 2>&1 | tee logs-ksud.log

      - name: Stage ksud into manager
        run: |
          set -eux
          mkdir -p manager/app/src/main/jniLibs/arm64-v8a
          cp -f target/aarch64-linux-android/release/ksud manager/app/src/main/jniLibs/arm64-v8a/libksud.so
          ls -l manager/app/src/main/jniLibs/arm64-v8a/

      - name: Keystore (fixed)
        run: |
          set -eux
          base64 -d manager_ci/nova-release.keystore.b64 > "$GITHUB_WORKSPACE/key.jks"
          keytool -list -keystore "$GITHUB_WORKSPACE/key.jks" -storepass "$KEYSTORE_PASS" | head -n 5
          keytool -exportcert -keystore "$GITHUB_WORKSPACE/key.jks" -storepass "$KEYSTORE_PASS" -alias nova -file "$GITHUB_WORKSPACE/cert.der"
          sha256sum "$GITHUB_WORKSPACE/cert.der"
          stat -c %s "$GITHUB_WORKSPACE/cert.der"
          {
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/key.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASS"
            echo "KEY_ALIAS=nova"
            echo "KEY_PASSWORD=$KEYSTORE_PASS"
          } >> manager/gradle.properties

      - name: Gradle assembleRelease
        run: |
          set -o pipefail
          cd manager
          ./gradlew --no-daemon assembleRelease 2>&1 | tee ../logs-gradle.log

      - name: Verify signer cert matches kernel expectation
        run: |
          set -eux
          APK=$(ls manager/app/build/outputs/apk/release/*.apk | head -n1)
          echo "APK=$APK"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort | tail -n1)
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          grep -qi "${EXPECTED_CERT_SHA256}" certs.txt
          echo "signer cert matches kernel expected hash"

      - name: Publish release
        run: |
          set -eux
          gh release create "nova-manager-fixedkey-$GITHUB_RUN_ID" -R "$REPO" \
            --title "SukiSU Nova manager (fixed key) #$GITHUB_RUN_ID" \
            --notes "Built from SukiSU-Nova main ($GITHUB_SHA). Signed with fixed personal key; cert sha256 $EXPECTED_CERT_SHA256 (DER 803 bytes)." \
            manager/app/build/outputs/apk/release/*.apk

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ksud-gradle-${{ github.run_id }}
          path: |
            logs-ksud.log
            logs-gradle.log
            certs.txt
          if-no-files-found: ignore
