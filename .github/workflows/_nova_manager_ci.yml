name: _nova_manager_ci

# 在 fork 里用 GitHub 托管 runner 复现 SukiSU Nova 管理器的源码构建
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_nova_manager_ci.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      KEYSTORE_PASS: nova-ci-pass
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK inventory
        run: |
          set -x
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          ls "$SDK" || true
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true
          ls "$SDK/ndk" || true
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          NDK_DIR="$(ls -d "$SDK"/ndk/* 2>/dev/null | head -n1 || true)"
          if [ -n "$NDK_DIR" ]; then echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"; fi

      - name: Try install SDK components
        continue-on-error: true
        run: |
          set -x
          SDK="$ANDROID_SDK_ROOT"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -n 1)"; fi
          echo "sdkmanager=$SM"
          "$SM" --version || true
          "$SM" "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865" || true
          ls "$SDK/platforms" || true
          ls "$SDK/ndk" || true

      - name: Rust target
        run: |
          set -eux
          rustup target add aarch64-linux-android
          rustc --version

      - name: Build ksud (arm64)
        run: |
          set -o pipefail
          mkdir -p userspace/ksud/bin/aarch64 userspace/ksud/bin/arm userspace/ksud/bin/x86_64 userspace/ksud/bin/riscv64
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
          cargo build --target aarch64-linux-android --release --manifest-path ./userspace/ksud/Cargo.toml 2>&1 | tee logs-ksud.log

      - name: Stage ksud into manager
        run: |
          set -eux
          mkdir -p manager/app/src/main/jniLibs/arm64-v8a
          cp -f target/aarch64-linux-android/release/ksud manager/app/src/main/jniLibs/arm64-v8a/libksud.so
          ls -l manager/app/src/main/jniLibs/arm64-v8a/

      - name: Keystore
        run: |
          set -eux
          keytool -genkeypair -keystore "$GITHUB_WORKSPACE/key.jks" -storetype JKS \
            -alias nova -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" -dname "CN=SukiSU Nova CI"
          {
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/key.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASS"
            echo "KEY_ALIAS=nova"
            echo "KEY_PASSWORD=$KEYSTORE_PASS"
          } >> manager/gradle.properties

      - name: Gradle assembleRelease
        run: |
          set -o pipefail
          cd manager
          ./gradlew --no-daemon assembleRelease 2>&1 | tee ../logs-gradle.log

      - name: Publish release
        run: |
          set -eux
          ls -l "$GITHUB_WORKSPACE/manager/app/build/outputs/apk/release/"
          gh release create "nova-manager-ci-$GITHUB_RUN_ID" -R "$REPO" \
            --title "SukiSU Nova manager CI #$GITHUB_RUN_ID" \
            --notes "Built from SukiSU-Nova/SukiSU-Nova main (commit $GITHUB_SHA) with ksud built from source (arm64)." \
            manager/app/build/outputs/apk/release/*.apk

      - name: Report status
        if: always()
        env:
          RUN_STATUS: ${{ job.status }}
        run: |
          set -x
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "sha=$GITHUB_SHA"
            echo "status=$RUN_STATUS"
            echo '--- ksud tail ---'
            tail -n 100 logs-ksud.log 2>/dev/null || true
            echo '--- gradle tail ---'
            tail -n 200 logs-gradle.log 2>/dev/null || true
          } > ci-nova-status.txt 2>&1
          gh issue create -R "$REPO" \
            --title "Nova CI run $GITHUB_RUN_ID ($RUN_STATUS)" \
            --body-file ci-nova-status.txt || true
